<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso trabajadores | ViajaPerú</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/admin.css">
    <script src="../js/data.js" defer></script>
    <script src="../js/utils.js" defer></script>
    <script src="../js/admin.js" defer></script>
</head>
<body class="admin-body">
    <main class="staff-login">
        <form id="staffLoginForm" class="form-card">
            <a class="logo" href="../index.html">Viaja<span>Perú</span></a>
            <h1>Acceso para trabajadores</h1>
            <p class="sub">Ingresa con tu cuenta de la empresa.</p>

            <div class="form-group">
                <label for="staffEmail">Correo corporativo</label>
                <input id="staffEmail" type="email" autocomplete="email" required maxlength="254" autofocus>
            </div>
            <div class="form-group">
                <label for="staffPassword">Contraseña</label>
                <input id="staffPassword" type="password" autocomplete="current-password" required>
            </div>

            <button class="btn full-width" type="submit">Entrar al panel</button>
            <p id="staffMessage" class="form-message" aria-live="polite"></p>
            <a class="demo-link" href="dashboard.html">Ir al panel (solo durante el desarrollo)</a>
        </form>
    </main>
</body>
</html>
