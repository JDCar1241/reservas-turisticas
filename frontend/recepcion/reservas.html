<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas | ViajaPerú</title>
    <script>
        /* Diagnóstico: guarda los errores de carga para mostrarlos en pantalla si algo falla */
        window.__errores = [];
        window.addEventListener("error", (e) => {
            const t = e.target;
            if (t && t.tagName === "SCRIPT") window.__errores.push("No se pudo cargar el archivo " + (t.getAttribute("src") || ""));
            else if (e.message) window.__errores.push(((e.filename || "").split("/").pop() || "script") + ": " + e.message);
        }, true);
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/admin.css">
    <script src="../js/data.js" defer></script>
    <script src="../js/utils.js" defer></script>
    <script src="../js/admin-guard.js" defer></script>
    <script src="../js/admin-reservas.js" defer></script>
</head>
<body class="admin-body" data-roles="recepcionista">
<div class="admin-shell">
    <aside class="sidebar" id="sidebar">
        <a class="logo" href="dashboard.html">Viaja<span>Perú</span><small class="role">Recepción</small></a>
        <nav class="side-nav" aria-label="Principal">
            <a class="nav-item" href="dashboard.html">Inicio</a>
            <a class="nav-item active" href="reservas.html" aria-current="page">Reservas</a>
            <a class="nav-item" href="clientes.html">Clientes</a>
        </nav>
        <nav class="side-nav bottom" aria-label="Cuenta">
            <span class="nav-item is-soon" aria-disabled="true">Mi perfil <small>Pronto</small></span>
            <a class="nav-item" href="../index.html" id="staffLogout">Cerrar sesión</a>
        </nav>
    </aside>

    <main class="admin-main">
        <div class="topbar">
            <div>
                <h1>Reservas</h1>
                <p>Consulta, confirma o cancela las solicitudes de los clientes</p>
            </div>
            <button class="btn btn-outline btn-small menu-toggle" id="menuToggle" type="button" aria-controls="sidebar">Menú</button>
        </div>

        <div class="toolbar">
            <div class="form-group">
                <label for="resSearch">Buscar</label>
                <input id="resSearch" type="search" placeholder="Código, cliente o destino">
            </div>
            <div class="form-group">
                <label for="resStatus">Estado</label>
                <select id="resStatus">
                    <option value="todas">Todos</option>
                    <option value="pendiente">Pendientes</option>
                    <option value="confirmada">Confirmadas</option>
                    <option value="cancelada">Canceladas</option>
                </select>
            </div>
            <p class="count" id="resCount" aria-live="polite"></p>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Código</th><th>Cliente</th><th>Paquete</th><th>Salida</th>
                        <th>Pasajeros</th><th>Importe</th><th>Estado</th><th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="resBody"></tbody>
            </table>
            <p class="empty-message hidden" id="resEmpty">Aún no hay reservas registradas.</p>
        </div>
            <p id="resStatusMsg" class="form-message" aria-live="polite"></p>
    </main>
</div>
<script>
    window.addEventListener("load", () => {
        const faltan = ["solicitarAPI", "limpiarMensaje", "cargarReservas"].filter((f) => typeof window[f] !== "function");
        if (!window.__errores.length && !faltan.length) return;

        const aviso = document.createElement("div");
        aviso.className = "form-message error";
        aviso.style.cssText = "margin:16px;white-space:pre-line";
        aviso.textContent = "Este panel no se cargó bien.\n" +
            (faltan.length ? "No están disponibles: " + faltan.join(", ") + ". Revisa que existan js/data.js, js/utils.js y js/admin-reservas.js.\n" : "") +
            window.__errores.join("\n");
        document.body.prepend(aviso);
    });
</script>
</body>
</html>
